name: Central API sync to GAS

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type AUDIT for read-only diff or SYNC to update GAS after successful audit'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: central-api-gas-sync
  cancel-in-progress: false

jobs:
  sync:
    name: Sync GitHub source to Apps Script
    runs-on: ubuntu-latest
    env:
      GAS_SCRIPT_ID: ${{ secrets.GAS_SCRIPT_ID }}
      CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}

    steps:
      - name: Require explicit audit or sync confirmation
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.confirm }}" in
            AUDIT|SYNC) ;;
            *) echo "Confirmation must be exactly AUDIT or SYNC" >&2; exit 1 ;;
          esac

      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The guarded recovery may compare the remote file 25 with an
          # immutable, pinned historical Git revision.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate required GitHub Actions secrets
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GAS_SCRIPT_ID:-}" ]; then
            echo "Repository secret GAS_SCRIPT_ID is not configured." >&2
            exit 1
          fi
          if [ -z "${CLASPRC_JSON:-}" ]; then
            echo "Repository secret CLASPRC_JSON is not configured." >&2
            exit 1
          fi

      - name: Validate Central API source before sync
        shell: bash
        run: |
          set -euo pipefail

          tmp_dir="$(mktemp -d)"
          expected="$(mktemp)"
          actual="$(mktemp)"
          trap 'rm -rf "$tmp_dir"; rm -f "$expected" "$actual"' EXIT

          shopt -s nullglob
          files=(central-api/*.gs)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No central-api/*.gs files found." >&2
            exit 1
          fi

          for file in "${files[@]}"; do
            base="$(basename "${file%.gs}")"
            cp "$file" "$tmp_dir/$base.js"
            node --check "$tmp_dir/$base.js"
          done

          grep -Ev '^[[:space:]]*(#|$)' central-api/SOURCE_SHA256SUMS.txt > "$expected"
          (
            cd central-api
            while IFS= read -r file; do
              sha256sum "$file"
            done < <(
              find . -maxdepth 1 -type f -name '*.gs' -printf '%f\n' | LC_ALL=C sort
            )
          ) > "$actual"

          diff -u "$expected" "$actual"

      - name: Install clasp
        shell: bash
        run: npm install --global @google/clasp@3.3.0

      - name: Restore clasp OAuth credentials
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"

      - name: Configure temporary clasp project
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const config = {
            scriptId: process.env.GAS_SCRIPT_ID,
            rootDir: ".gas-stage",
            scriptExtensions: [".gs", ".js"]
          };
          fs.writeFileSync(".clasp.json", JSON.stringify(config, null, 2) + "\n");
          NODE

      - name: Pull current GAS project into staging
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .gas-stage
          mkdir -p .gas-stage
          clasp pull

          if [ ! -f .gas-stage/appsscript.json ]; then
            echo "appsscript.json was not returned by GAS. Refusing to push." >&2
            exit 1
          fi

      # Read-only audit. Script source and private values remain on the runner.
      # The summary lists filenames/counts only, never source text or secrets.
      - name: Audit remote GAS script names and source drift (NO PUSH)
        id: gas_audit
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const crypto = require('crypto');
          const git = 'central-api';
          const live = '.gas-stage';
          const scripts = dir => fs.readdirSync(dir).filter(name => /\.(gs|js)$/.test(name));
          const localNames = scripts(git).filter(name => name.endsWith('.gs'));
          const liveNames = scripts(live);
          const byBase = names => {
            const map = new Map();
            for (const name of names) {
              const base = name.replace(/\.(gs|js)$/, '');
              if (map.has(base)) throw Error('Duplicate GAS script basename in project');
              map.set(base, name);
            }
            return map;
          };
          const expected = byBase(localNames);
          const actual = byBase(liveNames);
          const normalize = name => fs.readFileSync(name, 'utf8').replace(/\r\n?/g, '\n');
          const digest = text => crypto.createHash('sha256').update(text, 'utf8').digest('hex');
          const extra = [...actual.keys()].filter(name => !expected.has(name)).sort();
          const add = [...expected.keys()].filter(name => !actual.has(name)).sort();
          const change = [...expected.keys()].filter(name => actual.has(name) &&
            digest(normalize(path.join(git, expected.get(name)))) !==
            digest(normalize(path.join(live, actual.get(name))))).sort();
          const same = expected.size - add.length - change.length;
          const lines = [
            '## Central API source AUDIT (read only)',
            '',
            '- Requested action: ' + process.env.CONFIRM_MODE,
            '- Remote GAS scripts: ' + actual.size,
            '- GitHub server scripts: ' + expected.size,
            '- Source changed: ' + change.length,
            '- New GitHub scripts: ' + add.length,
            '- Identical: ' + same,
            '- Extra remote scripts that SYNC would overwrite/remove: ' + extra.length,
            '',
            '### Changed files',
            change.length ? change.map(x=>'- ' + x + '.gs').join('\n') : '- None',
            '',
            '### New GitHub files',
            add.length ? add.map(x=>'- ' + x + '.gs').join('\n') : '- None',
            '',
            '### Unexpected remote scripts (SYNC BLOCKED until reconciled)',
            extra.length ? extra.map(x=>'- ' + actual.get(x)).join('\n') : '- None',
            '',
            'This audit does not read Script Properties, write GAS, deploy a Web App,',
            'create sheets, or change requestId history.'
          ];
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, lines.join('\n') + '\n');
          const allowedFile25 = '25_Request_Ledger_V2_Legacy_Batch_Migration';
          const unexpectedDrift = change.filter(name => name !== allowedFile25);
          fs.appendFileSync(process.env.GITHUB_OUTPUT,
            'extra_count=' + extra.length + '\n' +
            'new_count=' + add.length + '\n' +
            'unexpected_change_count=' + unexpectedDrift.length + '\n');
          process.stdout.write(
            'GAS AUDIT: remote=' + actual.size +
            ' expected=' + expected.size + ' changed=' + change.length +
            ' new=' + add.length + ' unexpected=' + extra.length + '\n');
          NODE
        env:
          CONFIRM_MODE: ${{ inputs.confirm }}

      - name: Block SYNC if live GAS has unexpected scripts
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.gas_audit.outputs.extra_count }}" != "0" ]; then
            echo "SYNC blocked: unexpected remote GAS source files would be deleted. Run AUDIT and reconcile first." >&2
            exit 1
          fi

      - name: Block SYNC if GAS has missing or unapproved source drift
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ steps.gas_audit.outputs.new_count }}" != "0" ]; then
            echo "SYNC blocked: GitHub contains scripts missing from production; review the source inventory." >&2
            exit 1
          fi
          if [ "${{ steps.gas_audit.outputs.unexpected_change_count }}" != "0" ]; then
            echo "SYNC blocked: source drift outside approved file25; run AUDIT and reconcile first." >&2
            exit 1
          fi

      - name: Guard file 25 against unrecognized live source before SYNC
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          # Pin BOTH known safe baselines: historical source, and the
          # exact file 25 from the operator's earlier 26/26 VERIFIED_MATCH
          # production SYNC (commit 7a34bb4), independently verified 26/26.
          # Do not allow arbitrary revisions. Pinned sources stay on runner.
          git show 0c4be7c5e9e3eb39eafcd341618dacb79797dd36:central-api/25_Request_Ledger_V2_Legacy_Batch_Migration.gs > "$RUNNER_TEMP/vaa_pinned_legacy25.gs"
          git show 7a34bb4cf3cc45774dd15957888cbdaef7223c09:central-api/25_Request_Ledger_V2_Legacy_Batch_Migration.gs > "$RUNNER_TEMP/vaa_previous_prod25.gs"
          VAA_HISTORIC_FILE25="$RUNNER_TEMP/vaa_pinned_legacy25.gs" \
            VAA_PREVIOUS_PRODUCTION_FILE25="$RUNNER_TEMP/vaa_previous_prod25.gs" \
            node scripts/verify-central-api-sync.cjs preflight

      - name: Replace only server-side GAS source in staging
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail

          # Preserve the live manifest and any non-server files pulled from GAS.
          # GitHub central-api/*.gs is authoritative for server-side script files.
          find .gas-stage -type f \( -name '*.gs' -o -name '*.js' \) -delete
          cp central-api/*.gs .gas-stage/

          echo "Files staged for Apps Script:"
          find .gas-stage -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort

      - name: Show clasp push status
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          clasp status

      - name: Push GitHub Central API source to GAS
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          clasp push --force

      - name: Verify GAS source by independent remote pull after push
        if: ${{ inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          set -euo pipefail
          # A successful clasp push is not proof that the remote source stuck.
          # Pull afresh and compare all script files without printing contents.
          rm -rf .gas-stage
          mkdir -p .gas-stage
          clasp pull
          test -f .gas-stage/appsscript.json
          node scripts/verify-central-api-sync.cjs postflight

      - name: Sync summary
        if: ${{ success() && inputs.confirm == 'SYNC' }}
        shell: bash
        run: |
          {
            echo '## Central API -> GAS sync completed'
            echo
            printf '%s\n' "- Source: central-api/*.gs at commit ${GITHUB_SHA::7}"
            echo '- Target script ID: stored in repository secret GAS_SCRIPT_ID'
            echo '- Existing GAS appsscript.json and non-server files were preserved from a pre-push pull.'
            echo '- Independently re-pulled and verified every canonical GAS script after push.'
            echo '- This workflow updates project source only.'
            echo '- It does not create a new Apps Script version or redeploy the Web App.'
          } >> "$GITHUB_STEP_SUMMARY"
