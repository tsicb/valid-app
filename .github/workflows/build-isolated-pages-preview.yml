name: Build isolated Pages test bundle

on:
  workflow_dispatch:
    inputs:
      test_api_url:
        description: 'TEST GAS Web App /exec URL (never production)'
        required: true
        type: string
      confirm:
        description: 'Type TEST_ONLY to validate the test API and build the Pages bundle'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: build-isolated-pages-bundle
  cancel-in-progress: false

jobs:
  build:
    name: Verify isolated API and prepare downloadable test UI
    runs-on: ubuntu-latest
    env:
      TEST_API_URL: ${{ inputs.test_api_url }}
      TEST_CONFIRM: ${{ inputs.confirm }}
      EXPECTED_TEST_ROOT: 1ZZs2xDXlgaKKtBr1ZbZuMnSR2RpEzJKU
      EXPECTED_TEST_OUTPUT: 1WAcEG1AIrLvfwMYahgCLArmm9a0pcOu7

    steps:
      - name: Verify branch and test-only input
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF}" != "refs/heads/feature/incremental-update-pages" ]; then
            echo 'Select feature/incremental-update-pages in Run workflow.' >&2
            exit 1
          fi
          if [ "${TEST_CONFIRM}" != "TEST_ONLY" ]; then
            echo 'Confirmation must be exactly TEST_ONLY.' >&2
            exit 1
          fi
          node - <<'NODE'
          const input = process.env.TEST_API_URL;
          const prod = 'https://script.google.com/macros/s/AKfycbwS_-ptDyhVk5yrNtRB8I32WUJen-xdjKUtp-Rf7Dbdhhg4V9Vw3gneD9K7ErZgP_Y/exec';
          let url;
          try { url = new URL(input); } catch { throw Error('Invalid test URL'); }
          if (url.protocol !== 'https:' || url.hostname !== 'script.google.com' ||
              !/^\/macros\/s\/[a-zA-Z0-9_-]+\/exec$/.test(url.pathname) ||
              url.search || url.hash || url.href === prod) {
            throw Error('This workflow requires a different standalone TEST GAS /exec URL');
          }
          NODE

      - name: Checkout selected feature branch
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/*.test.cjs
          node --check scripts/build-append-smoke-site.mjs
          python -m unittest discover -s tests -p test_isolated_proxy.py

      - name: Probe deployed TEST Apps Script without an access key
        shell: bash
        run: |
          set -euo pipefail
          curl --location --fail --silent --show-error \
            --max-time 40 --retry 3 --retry-all-errors \
            --output "$RUNNER_TEMP/isolated-gas-probe.json" \
            "$TEST_API_URL"
          node - <<'NODE'
          const fs=require('node:fs');
          let data;
          try { data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/isolated-gas-probe.json','utf8')); }
          catch { throw Error('Test GAS did not return JSON; confirm Web App access and deployment.'); }
          const capability=data?.capabilities?.incrementalUpdate;
          if (data.ok!==true || data.service!=='valid-application-analysis-sheet-api' ||
              data.schemaVersion!=='3.0' || capability?.updateProtocol!=='IDENTITY_V1' ||
              !Array.isArray(capability.updateStrategies) ||
              !capability.updateStrategies.includes('APPEND') ||
              !capability.updateStrategies.includes('REPLACE')) {
            throw Error('Test GAS does not expose the expected IDENTITY_V1 version.');
          }
          if (data.rootFolderId !== process.env.EXPECTED_TEST_ROOT ||
              data.sheetOutputFolderId !== process.env.EXPECTED_TEST_OUTPUT) {
            throw Error('Test GAS Drive destinations are not the isolated test folders; refuse to proceed.');
          }
          console.log('TEST API capability, schema and isolated Drive destinations verified.');
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '### Test GAS preflight success\n\n' +
            '- Schema 3.0 and IDENTITY_V1 supported\n' +
            '- APPEND / REPLACE supported\n' +
            '- Both Drive destination IDs match the isolated test folders\n' +
            '- No access key or actual applicant data was sent\n');
          NODE

      - name: Probe test GAS POST routing with an intentionally invalid key
        shell: bash
        run: |
          set -euo pipefail
          # This checks doPost without sending any real credentials.
          cat > "$RUNNER_TEMP/invalid-auth-probe.json" <<'JSON'
          {"action":"manageAuthCheck","schemaVersion":"3.0","pagesVersion":"2026.09.03-etl-v2.22-prerelease-clean","accessKey":"INVALID_SMOKE_TEST_KEY_DO_NOT_ACCEPT"}
          JSON
          curl --location --fail --silent --show-error \
            --max-time 40 --retry 2 --retry-all-errors \
            -H "Content-Type: text/plain;charset=UTF-8" \
            --data-binary "@$RUNNER_TEMP/invalid-auth-probe.json" \
            --output "$RUNNER_TEMP/invalid-auth-response.json" "$TEST_API_URL"
          node - <<'NODE'
          const fs=require('node:fs');
          let data;
          try { data=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/invalid-auth-response.json','utf8')); }
          catch { throw Error('Test GAS POST did not return JSON. Check the Web App deployment.'); }
          if (data?.ok!==false || data?.code!=='AUTH_INVALID') {
            throw Error('Test GAS did not reject the intentionally invalid key as expected.');
          }
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '- Test GAS POST rejects a deliberately invalid key with AUTH_INVALID (no actual credential was supplied)\\n');
          NODE

      - name: Generate localhost browser test site
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-append-smoke-site.mjs "$TEST_API_URL"
          mkdir -p .smoke-pages/samples
          cp tests/fixtures/append-smoke/*.csv .smoke-pages/samples/
          cat > .smoke-pages/START_TEST_WINDOWS.cmd <<'CMD'
          @echo off
          cd /d "%~dp0"
          echo Serving isolated valid-app at http://localhost:8765/index.html
          start "" "http://localhost:8765/index.html"
          where py >nul 2>nul
          if %errorlevel% == 0 (
            py serve_isolated_test.py
          ) else (
            python serve_isolated_test.py
          )
          pause
          CMD
          cat > .smoke-pages/READ_ME_FIRST.txt <<'TXT'
          valid-app: isolated incremental-update TEST site

          1. Extract this ZIP to a folder on your Windows PC.
          2. Open that folder in File Explorer, type cmd in the address bar.
          3. In Command Prompt, run: python serve_isolated_test.py
             (If needed: py serve_isolated_test.py)
          4. Open http://localhost:8765/index.html in your browser.
          5. Do NOT use python -m http.server 8765: it cannot relay
             Apps Script API requests and will cause authentication failures.
          6. The Python server binds to 127.0.0.1 only and does not log
             POST bodies or access keys.
          7. Enter ONLY the test GAS ACCESS_KEY from the test Apps Script project.
          8. Use the fake CSV files in the samples subfolder.
          9. CREATE: 01_初回応募.csv + 01_初回求人.csv
          10. APPEND: 02_重複追加応募.csv + 02_改稿求人.csv
          11. Repeat step 10; no new applications should be added.
          12. APPEND: 03_日次数減少応募.csv (should not delete saved records).
          13. REPLACE: 04_全件入れ替え応募.csv + 04_入れ替え求人.csv

          Never upload production applicant files or production access keys.
          This site talks only to the test GAS URL supplied at build time.
          It was NOT deployed to your public GitHub Pages site.
          TXT

      - name: Include isolated legacy migration exercise
        shell: bash
        run: |
          set -euo pipefail
          test -s .smoke-pages/legacy-create.html
          cat > .smoke-pages/LEGACY_MIGRATION_TEST.txt <<'TXT'
          Legacy migration test (synthetic data only)

          IMPORTANT: Do not update the already verified 5-application demo Sheet.
          This exercise creates an entirely separate test-company workbook.

          1. Start the Python server with: python serve_isolated_test.py
          2. Visit http://localhost:8765/legacy-create.html
          3. Enter the TEST ONLY access key. Create a new fake company named
             LEGACY_MIGRATION_TEST and upload ONLY these two samples:
               samples/01_初回応募.csv
               samples/01_初回求人.csv
          4. After saving, use the newly created company Sheet URL.
             Expected old-format application total: 7.
             Expected: applicationIdentityVersion is missing from 99_内部状態.
             Do not operate on the previous 5-row demo company.
          5. Visit http://localhost:8765/index.html#sheet=<NEW_SHEET_ID>
             Upload 02_重複追加応募.csv and 02_改稿求人.csv.
             Select APPEND; the API must report MIGRATION_REQUIRED.
             The original 7 saved applications and DataStore pointer must remain.
          6. With the SAME new test company, select REPLACE using
             01_初回応募.csv and 01_初回求人.csv.
             Confirm the destructive-operation checkbox.
             Expected: 7 applicants, identity version 1, old legacy
             DataStore retained as the backup.
          7. APPEND 02_重複追加応募.csv and 02_改稿求人.csv.
             Expected: 10 applicants (+3), 2 jobs, salary 1200 unchanged.

          Record results without sharing any access key or applicant details.
          The legacy-create.html variant refuses UPDATE and rejects any
          filenames other than the two expected synthetic sample CSVs.
          TXT

      - name: Stage visible artifact folder for upload
        shell: bash
        run: |
          set -euo pipefail
          # upload-artifact@v4 skips dot-prefixed paths by default.
          # Keep the local smoke folder hidden, but publish an explicit
          # non-hidden staging copy containing only the generated test UI.
          mkdir -p isolated-pages-artifact
          cp -a .smoke-pages/. isolated-pages-artifact/
          test -s isolated-pages-artifact/index.html
          test -s isolated-pages-artifact/report.html
          test -s isolated-pages-artifact/START_TEST_WINDOWS.cmd
          test -s isolated-pages-artifact/serve_isolated_test.py
          test -s isolated-pages-artifact/SMOKE_TEST_API_URL.txt
          test -s isolated-pages-artifact/samples/01_初回応募.csv
          test -s isolated-pages-artifact/legacy-create.html
          test -s isolated-pages-artifact/LEGACY_MIGRATION_TEST.txt
          echo "Test browser bundle contains $(find isolated-pages-artifact -type f | wc -l) files."

      - name: Upload private test bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: valid-app-isolated-pages-test
          path: isolated-pages-artifact/
          retention-days: 7
          if-no-files-found: error

      - name: Report preparation complete
        if: success()
        shell: bash
        run: |
          {
            echo
            echo '### Browser test bundle ready'
            echo
            echo 'Download the valid-app-isolated-pages-test artifact at the bottom of this run.'
            echo 'Unzip; open a Command Prompt in the folder; run python serve_isolated_test.py.'
            echo 'No production Pages or GAS deployment was changed.'
          } >> "$GITHUB_STEP_SUMMARY"
